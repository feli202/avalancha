<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estratos · opción 4 · embudo</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/index.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/600.css">
<link rel="stylesheet" href="../../src/ui/hielo.css">
<link rel="stylesheet" href="comun.css">
<style>
  .estratos { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.75rem; }
  .lienzo .presion { position: absolute; left: 0; top: 0; z-index: 1; }
</style>
</head>
<body>
<main class="cristalizacion">
  <section class="estratos">
    <div class="lienzo" id="lienzo"></div>
    <aside class="ficha placa grietas" id="ficha"></aside>
  </section>
</main>
<script src="comun.js"></script>
<script>
marco()
document.getElementById('ficha').innerHTML = fichaHTML(EST[0])
const cont = document.getElementById('lienzo')
cont.insertAdjacentHTML('beforeend', PRESION_HTML)

// Embudo: la pila arriba y los estratos cada vez más angostos y hondos. Cada uno se llena desde el centro;
// cuando rebalsa por los costados, la arena resbala por la pared de hielo hasta el centro del de abajo.
const FILAS = 7
let G = null, pilas = []
function armar({ W, H }) {
  const arriba = 96, paso = (H - arriba) / 8, cel = Math.max(2, Math.floor((paso - 16) / FILAS))
  const bandas = EST.map((e, k) => {
    const wc = Math.floor((W * (0.84 - k * 0.07)) / cel), w = wc * cel
    return { wc, w, x: Math.round((W - w) / 2), y: Math.round(arriba + k * paso), h: FILAS * cel }
  })
  G = { W, H, cel, bandas }
  pilas = EST.slice(0, 3).map((e, k) => {
    // el piso tiene poros (cada tanto una columna que filtra) y rebalsa por los costados
    const wc = bandas[k].wc, p = new Pila(wc, FILAS, { sumidero: (x, y, dx, dy) => dx !== 0 || (dy === 1 && hash(x, 5 + k) < 0.12) })
    p.sembrar(e.lleno * 0.97, () => [wc / 2, 0])
    return p
  })
}
const L = lienzo(cont, armar)

function paso() {
  if (!G) return
  const b0 = G.bandas[0]
  for (let k = 0; k < 4; k++) lanzar(G.W / 2 + (Math.random() - 0.5) * 4, 52, G.W / 2, b0.y, { dur: 360, al: () => pilas[0].echar(1, b0.wc / 2, 0) })
  pilas.forEach((p, k) => {
    p.paso(2500)
    const b = G.bandas[k], n = G.bandas[k + 1], sig = pilas[k + 1]
    for (const [x, y, dx, , q] of p.salidas.splice(0)) {
      if (!dx) { // se filtró por un poro: cae derecho, hacia el centro del de abajo
        const nx = n.wc / 2 + (x - b.wc / 2) * (n.wc / b.wc)
        lanzar(b.x + x * G.cel, b.y + b.h + 4, n.x + nx * G.cel, n.y, { dur: 420, tam: Math.max(2, G.cel - 2), al: sig ? () => sig.echar(q, nx, 0) : null })
        continue
      }
      const sx = dx > 0 ? b.x + b.w + 2 : b.x - 3, sy = b.y + y * G.cel
      // resbala por la pared: del borde de este al centro del de abajo
      lanzar(sx, sy, G.W / 2 + (Math.random() - 0.5) * 6, n.y, { dur: 700, arco: -8, tam: Math.max(2, G.cel - 2), al: sig ? () => sig.echar(q, n.wc / 2, 0) : null })
    }
  })
}

bucle(paso, (t, dt) => {
  const { ctx, W, H } = L
  ctx.clearRect(0, 0, W, H)
  if (!G) return
  // las paredes del embudo: hielo que se oscurece con la profundidad
  const B = G.bandas
  ctx.beginPath(); ctx.moveTo(B[0].x - 10, B[0].y - 6)
  B.forEach((b) => { ctx.lineTo(b.x - 10, b.y - 6); ctx.lineTo(b.x - 10, b.y + b.h + 8) })
  for (let k = B.length - 1; k >= 0; k--) { const b = B[k]; ctx.lineTo(b.x + b.w + 10, b.y + b.h + 8); ctx.lineTo(b.x + b.w + 10, b.y - 6) }
  ctx.closePath()
  const g = ctx.createLinearGradient(0, B[0].y, 0, H); g.addColorStop(0, 'rgb(159 227 245 / 0.06)'); g.addColorStop(1, 'rgb(2 4 10 / 0.7)')
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = 'rgb(159 227 245 / 0.28)'; ctx.lineWidth = 1; ctx.stroke()
  pintarMadre(ctx, W / 2, -6, Math.min(W * 0.36, 250), { achatar: 0.24 })
  EST.forEach((e, k) => {
    const b = B[k]
    ctx.font = "600 12px 'Space Grotesk'"; ctx.textBaseline = 'middle'
    if (e.costo) { roca(ctx, b.x, b.y - 2, b.w, b.h + 6, e, { cel: G.cel }); return }
    losa(ctx, b.x, b.y, b.w, b.h, e.lleno, { tope: e.tope, margen: 3, esp: 3 + Math.round(e.lleno * 6), t })
    pintar(ctx, pilas[k], b.x, b.y, G.cel)
    ctx.textAlign = 'right'; ctx.fillStyle = k ? 'rgb(232 233 243 / 0.6)' : '#9fe3f5'; ctx.fillText(e.n, b.x - 20, b.y + b.h / 2)
    ctx.textAlign = 'left'; ctx.fillStyle = '#9fe3f5'; ctx.fillText('×' + e.aporte, b.x + b.w + 20, b.y + b.h / 2)
  })
  // el elegido
  const b = B[0]; ctx.strokeStyle = '#9fe3f5'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x - 6.5, b.y - 5.5, b.w + 13, b.h + 16)
  aire(ctx, dt)
})
</script>
</body>
</html>
