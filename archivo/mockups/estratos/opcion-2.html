<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estratos · opción 2 · columna</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/index.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/600.css">
<link rel="stylesheet" href="../../src/ui/hielo.css">
<link rel="stylesheet" href="comun.css">
<style>
  .estratos { display: grid; grid-template-columns: 13rem minmax(0, 1fr) 20rem; gap: 1.5rem; }
  .izq { display: grid; align-content: start; gap: 1.5rem; padding-top: 0.25rem; }
  /* el índice: saltar a un estrato */
  .indice { display: grid; gap: 0.15rem; margin: 0; padding: 0; list-style: none; }
  .indice li { display: grid; grid-template-columns: 1.4rem 1fr auto; align-items: baseline; padding: 0.3rem 0.5rem; font-size: 0.8125rem; color: var(--tenue); }
  .indice li b { font-weight: 600; color: var(--escarcha); }
  .indice li .x { color: var(--hielo); }
  .indice li.cerrado { color: rgb(232 233 243 / 0.35); }
  .indice li.cerrado b { color: rgb(232 233 243 / 0.4); }
  .indice li[aria-current] { background: linear-gradient(var(--hielo), var(--hielo)) left / 2px 100% no-repeat, rgb(159 227 245 / 0.07); }
  /* la columna: solo esta caja scrollea */
  .columna { position: relative; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgb(159 227 245 / 0.3) transparent;
    mask-image: linear-gradient(transparent, #000 1.5rem, #000 calc(100% - 3rem), transparent); }
  .columna .lienzo { height: 2540px; }
</style>
</head>
<body>
<main class="cristalizacion">
  <section class="estratos">
    <div class="izq" id="izq"></div>
    <div class="columna" id="columna"><div class="lienzo" id="lienzo"></div></div>
    <aside class="ficha placa grietas" id="ficha"></aside>
  </section>
</main>
<script src="comun.js"></script>
<script>
marco()
document.getElementById('ficha').innerHTML = fichaHTML(EST[0])
document.getElementById('izq').innerHTML = PRESION_HTML + `<ol class="indice num">${EST.map((e, k) => `<li class="${e.costo ? 'cerrado' : ''}" ${k ? '' : 'aria-current="true"'}><b>${e.n}</b><span>${e.costo ? 'roca · ' + e.costo : e.granos}</span><span class="x">${e.costo ? '' : '×' + e.aporte}</span></li>`).join('')}</ol>`
const cont = document.getElementById('lienzo')

// Columna vertical: cada estrato es una pila vista desde arriba, una debajo de la otra; la arena cae por el centro.
const N = 48, CEL = 5, LADO = N * CEL, ARRIBA = 150, PASO = 300
let G = null
const pilas = EST.slice(0, 3).map((e) => { const p = new Pila(N, N); p.sembrar(e.lleno * 0.86); return p })
const centro = (k) => [G.cx, ARRIBA + k * PASO + LADO / 2]
const L = lienzo(cont, ({ W }) => { G = { cx: Math.round(W / 2) } })
document.getElementById('columna').scrollTop = 40

function paso() {
  if (!G) return
  for (let k = 0; k < 4; k++) {
    const [x, y] = centro(0)
    lanzar(x + (Math.random() - 0.5) * 6, 96, x, y, { dur: 420, al: () => pilas[0].echar(1) })
  }
  pilas.forEach((p, k) => {
    p.paso(3000)
    const [cx, cy] = centro(k), [nx, ny] = centro(k + 1), sig = pilas[k + 1]
    for (const [x, y, dx, dy, q] of p.salidas.splice(0)) {
      if (dy === -1) { sig?.echar(q); continue } // lo que sale por arriba no se ve caer
      const sx = cx - LADO / 2 + x * CEL + dx * 6, sy = cy - LADO / 2 + y * CEL + dy * 6
      lanzar(sx, sy, nx + (Math.random() - 0.5) * 8, k + 1 < 3 ? ny : ny - LADO / 2, { dur: 650, arco: 18, tam: 3, al: sig ? () => sig.echar(q) : null })
    }
  })
}

bucle(paso, (t, dt) => {
  const { ctx, W, H } = L
  ctx.clearRect(0, 0, W, H)
  if (!G) return
  pintarMadre(ctx, G.cx, -10, 120)
  EST.forEach((e, k) => {
    const [cx, cy] = centro(k), x = cx - LADO / 2, y = cy - LADO / 2
    if (e.costo) { roca(ctx, x - 6, y - 6, LADO + 12, LADO + 12, e, { cel: 6 }); return }
    losa(ctx, x, y, LADO, LADO, e.lleno, { tope: e.tope, t, margen: 8 })
    pintar(ctx, pilas[k], x, y, CEL)
    ctx.font = "600 13px 'Space Grotesk'"; ctx.textBaseline = 'top'; ctx.textAlign = 'left'
    ctx.fillStyle = k ? 'rgb(232 233 243 / 0.6)' : '#9fe3f5'; ctx.fillText(`Estrato ${e.n}`, x - 8, y - 30)
    ctx.textAlign = 'right'; ctx.fillStyle = '#9fe3f5'; ctx.fillText('×' + e.aporte, x + LADO + 8, y - 30)
    if (k === 0) { // el elegido: esquinas de hielo
      ctx.fillStyle = '#9fe3f5'; const m = 16
      for (const [ex, ey, sx, sy] of [[x - m, y - m, 1, 1], [x + LADO + m, y - m, -1, 1], [x - m, y + LADO + m + 20, 1, -1], [x + LADO + m, y + LADO + m + 20, -1, -1]]) {
        ctx.fillRect(Math.min(ex, ex + sx * 14), ey - (sy < 0 ? 2 : 0), 14, 2); ctx.fillRect(ex - (sx < 0 ? 2 : 0), Math.min(ey, ey + sy * 14), 2, 14)
      }
    }
  })
  aire(ctx, dt)
})
</script>
</body>
</html>
