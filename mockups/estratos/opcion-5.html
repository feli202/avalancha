<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estratos · opción 5 · grilla</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/300.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/index.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/space-grotesk/600.css">
<link rel="stylesheet" href="../../src/ui/hielo.css">
<link rel="stylesheet" href="comun.css">
<style>
  .estratos { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 1.75rem; }
  .lienzo .presion { position: absolute; right: 0; top: 0; z-index: 1; text-align: right; }
</style>
</head>
<body>
<main class="cristalizacion">
  <section class="estratos">
    <div class="lienzo" id="lienzo"></div>
    <aside class="ficha placa grietas" id="ficha"></aside>
  </section>
</main>
<script src="comun.js"></script>
<script>
marco()
document.getElementById('ficha').innerHTML = fichaHTML(EST[0])
const cont = document.getElementById('lienzo')
cont.insertAdjacentHTML('beforeend', PRESION_HTML)

// Grilla de 2×4: cada casilla es un estrato; la arena que se derrumba por el borde salta a la casilla siguiente
// (en serpentina: 1 → 4 por arriba, baja al 5 y vuelve 5 → 8 por abajo).
const N = 32
const pilas = EST.slice(0, 3).map((e) => { const p = new Pila(N, N); p.sembrar(e.lleno * 0.86); return p })
let G = null
const L = lienzo(cont, ({ W, H }) => {
  const arriba = 92, hueco = 34, rot = 26
  const cel = Math.max(2, Math.floor(Math.min((W - 3 * hueco) / 4, (H - arriba - hueco - 2 * rot - 20) / 2) / N)), lado = cel * N
  const x0 = Math.round((W - (4 * lado + 3 * hueco)) / 2)
  const cas = EST.map((e, k) => {
    const fila = k < 4 ? 0 : 1, col = fila ? 7 - k : k
    return { x: x0 + col * (lado + hueco), y: arriba + rot + fila * (lado + hueco + rot) }
  })
  G = { W, H, cel, lado, cas }
})
const centro = (k) => [G.cas[k].x + G.lado / 2, G.cas[k].y + G.lado / 2]

function paso() {
  if (!G) return
  const [cx, cy] = centro(0)
  for (let k = 0; k < 3; k++) lanzar(cx + (Math.random() - 0.5) * 4, 34, cx, cy, { dur: 480, al: () => pilas[0].echar(1) })
  pilas.forEach((p, k) => {
    p.paso(2500)
    const sig = pilas[k + 1], [nx, ny] = centro(k + 1)
    let n = 0
    for (const [x, y, dx, dy, q] of p.salidas.splice(0)) {
      if (n++ % 2) { sig?.echar(q); continue } // la mitad viaja sin dibujarse, para no tapar
      const sx = G.cas[k].x + x * G.cel + dx * 6, sy = G.cas[k].y + y * G.cel + dy * 6
      const tx = sig ? nx + (Math.random() - 0.5) * 10 : nx + (Math.random() - 0.5) * G.lado * 0.6
      const ty = sig ? ny : G.cas[k + 1].y + 4
      lanzar(sx, sy, tx, ty, { dur: 800, arco: 46 + Math.random() * 20, tam: Math.max(2, G.cel - 1), al: sig ? () => sig.echar(q) : null })
    }
  })
}

bucle(paso, (t, dt) => {
  const { ctx, W, H } = L
  ctx.clearRect(0, 0, W, H)
  if (!G) return
  // el camino de la serpentina, muy tenue
  ctx.strokeStyle = 'rgb(159 227 245 / 0.14)'; ctx.setLineDash([2, 5]); ctx.lineWidth = 1; ctx.beginPath()
  EST.forEach((e, k) => { const [x, y] = centro(k); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y) }); ctx.stroke(); ctx.setLineDash([])
  const [mx] = centro(0)
  pintarMadre(ctx, mx, -24, Math.min(110, G.lado * 0.62), { achatar: 0.42 })
  EST.forEach((e, k) => {
    const { x, y } = G.cas[k], l = G.lado
    ctx.font = "600 13px 'Space Grotesk'"; ctx.textBaseline = 'bottom'
    if (e.costo) {
      roca(ctx, x - 6, y - 6, l + 12, l + 12, { n: '', costo: '' }, { cel: 6 })
      ctx.textAlign = 'center'; ctx.fillStyle = 'rgb(159 190 215 / 0.45)'; ctx.font = "600 22px 'Space Grotesk'"; ctx.textBaseline = 'middle'
      ctx.fillText(e.n, x + l / 2, y + l / 2 - 10)
      ctx.font = "600 13px 'Space Grotesk'"; ctx.fillText(e.costo, x + l / 2 - 6, y + l / 2 + 16); cristal(ctx, x + l / 2 + ctx.measureText(e.costo).width / 2 + 2, y + l / 2 + 16, 6, 0.45)
      return
    }
    losa(ctx, x, y, l, l, e.lleno, { tope: e.tope, t, margen: 6 })
    pintar(ctx, pilas[k], x, y, G.cel)
    ctx.textAlign = 'left'; ctx.fillStyle = k ? 'rgb(232 233 243 / 0.7)' : '#9fe3f5'; ctx.fillText(`Estrato ${e.n}`, x - 6, y - 12)
    ctx.textAlign = 'right'; ctx.fillStyle = '#9fe3f5'; ctx.fillText('×' + e.aporte, x + l + 6, y - 12)
    if (k === 0) { ctx.strokeStyle = '#9fe3f5'; ctx.lineWidth = 1.5; ctx.strokeRect(x - 11.5, y - 11.5, l + 23, l + 23 + 18) }
  })
  aire(ctx, dt)
})
</script>
</body>
</html>
