<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Que el navegador pregunte siempre por el index.html (los .js y .css llevan hash). src/version.svelte.ts avisa al que no hace caso. -->
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Avalancha</title>
    <!-- v1.0, bloque 3: el nombre es "Avalancha" en todos los idiomas, también al compartir el link. -->
    <meta name="description" content="Avalancha: juego incremental sobre una pila de arena abeliana. Del primer grano al Infinito. / An incremental game about an abelian sandpile." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avalancha" />
    <meta property="og:title" content="Avalancha" />
    <meta property="og:description" content="Juego incremental sobre una pila de arena abeliana. / An incremental game about an abelian sandpile." />
    <meta property="og:url" content="https://feli202.github.io/avalancha/" />
    <meta property="og:image" content="https://feli202.github.io/avalancha/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Avalancha" />
    <meta name="twitter:image" content="https://feli202.github.io/avalancha/og.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Instalable como app (PWA; src/instalar.svelte.ts). Rutas relativas: el sitio está en feli202.github.io/avalancha/. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07080f" />
    <!-- iOS: "Agregar a inicio" no usa SVG ni el manifest para el ícono: una mini pila de 180×180 (scripts/iconos.mjs). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Avalancha" />
    <!-- Instalado en iOS: barra de estado negra, el juego empieza debajo. El notch de costado (apaisado) y la barra de inicio, con
         env(safe-area-inset-*): #app a los costados y --nav en la barra de capas. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      /* SPEC 6.1 */
      :root {
        --fondo: #07080f; --tinta: #e8e9f3; --tenue: rgb(232 233 243 / 0.6); --apagado: rgb(232 233 243 / 0.5); /* 4,6:1 sobre el fondo (AA) */
        --vidrio: rgb(14 16 30 / 0.62); --borde: rgb(255 255 255 / 0.1);
        --ambar: #ffb547; --coral: #ff6b6b; --jade: #2dd4a7; --violeta: #9b7bff;
        /* SPEC_CAPA1 §11, estética helada: cian tenue para lo nuevo, blanco frío, azul noche casi negro. */
        --hielo: #9fe3f5; --escarcha: #eaf6ff; --noche: #04060d;
        color-scheme: dark;
      }
      /* SPEC 6.8: paleta para daltonismo (Okabe-Ito), la misma familia que la de la pila (pilaVisual.ts). */
      /* Alto de la barra de capas cuando va abajo (vertical; Capas.svelte, App.svelte). */
      @media (orientation: portrait) and (max-width: 1100px) { :root { --nav: calc(3.75rem + env(safe-area-inset-bottom)); } }
      :root.daltonismo { --ambar: #56b4e9; --coral: #e8743b; --jade: #f0e442; --violeta: #e7a3cf; }
      *, ::before, ::after { box-sizing: border-box; }
      body {
        margin: 0; background: var(--fondo); color: var(--tinta); overflow: hidden;
        font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      }
      /* Es un juego, no un documento: arrastrar o mantener presionado no selecciona texto (M1). Sí se copia lo que hay que copiar. */
      body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      textarea, input, code, .seleccionable { user-select: text; -webkit-user-select: text; }
      /* Cifras tabulares: los números no bailan al cambiar. */
      .num { font-variant-numeric: tabular-nums; }
      /* Solo para lectores de pantalla. */
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      /* Al cargar, la pantalla entra con un fundido corto (también directo al juego, con partida guardada). */
      #app { animation: entrar 0.5s ease-out; }
      /* Safe areas (viewport-fit=cover): #app es el bloque contenedor de todo lo fijo (transform), corrido lo que ocupa el notch.
         Fuera del iPhone los márgenes son 0 y no cambia nada. Abajo no: la barra de capas ya suma el suyo (--nav). */
      #app { position: fixed; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); transform: translateX(0); }
      @keyframes entrar { from { opacity: 0; } }
      :focus-visible { outline: 2px solid var(--ambar); outline-offset: 2px; }
      /* Reducir movimiento (Ajustes, ajustes.svelte.ts): en la interfaz los bucles corren una sola vez y las transiciones son
         instantáneas. La pila no entra: tiene su versión quieta propia (.quieto en Pila.svelte). */
      :root.reducir-movimiento body :not(.pila, .pila *), :root.reducir-movimiento body :not(.pila, .pila *)::before,
      :root.reducir-movimiento body :not(.pila, .pila *)::after { animation-iteration-count: 1 !important; transition-duration: 0s !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
